[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loveda-classwise-probability-rescue"
version = "0.1.0"
description = "Diagnosing class-specific failures and rescuing missing predictions on LoveDA"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mengle Xue", email = "rsdyxjh558@gmail.com"}]
dependencies = ["numpy>=1.24,<3", "Pillow>=9", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
full = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
